<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>两人游戏馆</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;700&display=swap">
<style>
/* 布局：窄单列——馆名、加入房间码，下面是游戏卡片列表；每张卡片一键建房并复制邀请 */
:root {
	--ground: #f3efe4;
	--ground-dot: #e6dfcd;
	--ink: #2f3328;
	--muted: #6a6e5c;
	--card: #fffdf8;
	--line: #ddd5c1;
	--accent: #2e83c6;
	--accent-deep: #1f659f;
	--leaf: #5c9a3c;
	--font-display: "ZCOOL KuaiLe", "PingFang SC", "Microsoft YaHei", sans-serif;
	--font-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
	color-scheme: light;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

body {
	margin: 0;
	min-height: 100vh;
	background:
		radial-gradient(circle at 30% 40%, var(--ground-dot) 0 1.5px, transparent 2.5px) 0 0 / 28px 28px,
		var(--ground);
	color: var(--ink);
	font-family: var(--font-body);
	font-size: 15px;
	line-height: 1.6;
	padding-left: max(16px, env(safe-area-inset-left, 0px));
	padding-right: max(16px, env(safe-area-inset-right, 0px));
	padding-block: calc(32px + env(safe-area-inset-top, 0px)) calc(40px + env(safe-area-inset-bottom, 0px));
}

main {
	display: flex;
	flex-direction: column;
	gap: 28px;
	max-width: 560px;
	margin: 0 auto;
}

h1 {
	margin: 0;
	font-family: var(--font-display);
	font-weight: 400;
	font-size: 2.4rem;
	line-height: 1.1;
	letter-spacing: 0.04em;
	text-wrap: balance;
}

.lead { margin: 6px 0 0; color: var(--muted); max-width: 32em; }

.join {
	display: flex;
	flex-wrap: wrap;
	gap: 10px;
	align-items: center;
}

.join input {
	flex: 1 1 180px;
	min-width: 0;
	padding: 10px 14px;
	border-radius: 12px;
	border: 2px solid var(--line);
	background: var(--card);
	color: var(--ink);
	font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
	font-size: 1.05rem;
	letter-spacing: 0.18em;
	text-transform: uppercase;
}

.btn {
	font-family: var(--font-display);
	font-size: 1.05rem;
	border: 0;
	border-radius: 999px;
	padding: 9px 18px;
	color: #fff;
	background: var(--accent);
	box-shadow: 0 4px 0 var(--accent-deep);
	cursor: pointer;
	white-space: nowrap;
}

.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--accent-deep); }
.btn:disabled { opacity: 0.6; cursor: progress; }
.btn:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.section-title {
	margin: 0 0 10px;
	font-size: 0.78rem;
	letter-spacing: 0.12em;
	color: var(--muted);
}

.games { display: grid; gap: 14px; }

.game {
	display: grid;
	grid-template-columns: auto minmax(0, 1fr);
	gap: 14px;
	padding: 16px;
	border-radius: 18px;
	background: var(--card);
	border: 1px solid var(--line);
	box-shadow: 0 5px 0 var(--line);
}

.game .icon {
	display: grid;
	place-items: center;
	width: 56px;
	height: 56px;
	border-radius: 14px;
	background: #c4e3a3;
	box-shadow: inset 0 -4px 0 var(--leaf);
	font-size: 30px;
}

.game h2 {
	margin: 0;
	font-family: var(--font-display);
	font-weight: 400;
	font-size: 1.4rem;
	line-height: 1.2;
}

.game p { margin: 4px 0 10px; color: var(--muted); font-size: 0.9rem; }

.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }

.tags span {
	padding: 1px 9px;
	border-radius: 999px;
	background: var(--ground);
	color: var(--muted);
	font-size: 0.75rem;
}

.status { min-height: 1.6em; color: var(--muted); font-size: 0.85rem; }
.status.error { color: #b2452f; }

footer { color: var(--muted); font-size: 0.8rem; }
</style>
</head>
<body>
<main>
	<header>
		<h1>两人游戏馆</h1>
		<p class="lead">建一个房间，把链接发给另一个人，两个人在各自的手机或电脑上一起玩。</p>
	</header>

	<section>
		<h2 class="section-title">已有房间码</h2>
		<form class="join" id="join-form">
			<input id="join-code" name="code" maxlength="6" autocomplete="off" placeholder="例如 K7QX2M" aria-label="房间码">
			<button class="btn" type="submit">加入</button>
		</form>
		<div class="status" id="join-status" role="status"></div>
	</section>

	<section>
		<h2 class="section-title">选一个游戏</h2>
		<div class="games" id="games">
			<div class="status">正在加载游戏列表…</div>
		</div>
	</section>

	<footer>房间闲置 7 天后自动清理。</footer>
</main>

<script type="module">
import { createRoom, getRoomInfo, normalizeCode } from "/shared/room-client.js";

const gamesEl = document.querySelector("#games");

function gameCard(game) {
	const card = document.createElement("article");
	card.className = "game";
	card.innerHTML = `
		<div class="icon" aria-hidden="true"></div>
		<div>
			<h2></h2>
			<p></p>
			<div class="tags"></div>
			<button class="btn" type="button">创建房间</button>
			<div class="status" role="status"></div>
		</div>`;
	card.querySelector(".icon").textContent = game.icon || "🎲";
	card.querySelector("h2").textContent = game.name;
	card.querySelector("p").textContent = game.summary;
	card.querySelector(".tags").replaceChildren(...[`${game.maxPlayers} 人`, ...(game.tags || [])].map((tag) => {
		const span = document.createElement("span");
		span.textContent = tag;
		return span;
	}));
	const button = card.querySelector("button");
	const status = card.querySelector(".status");
	button.addEventListener("click", async () => {
		button.disabled = true;
		status.className = "status";
		status.textContent = "正在创建房间…";
		try {
			const code = await createRoom(game.id);
			location.href = `/games/${game.id}/?room=${code}`;
		} catch (error) {
			status.className = "status error";
			status.textContent = error.message;
			button.disabled = false;
		}
	});
	return card;
}

async function loadGames() {
	try {
		const response = await fetch("/api/games");
		const games = await response.json();
		gamesEl.replaceChildren(...games.map(gameCard));
	} catch {
		gamesEl.innerHTML = '<div class="status error">游戏列表加载失败，请刷新页面重试。</div>';
	}
}

document.querySelector("#join-form").addEventListener("submit", async (event) => {
	event.preventDefault();
	const status = document.querySelector("#join-status");
	const code = normalizeCode(document.querySelector("#join-code").value);
	if (code.length !== 6) {
		status.className = "status error";
		status.textContent = "房间码是 6 位字母或数字。";
		return;
	}
	status.className = "status";
	status.textContent = "正在查找房间…";
	const info = await getRoomInfo(code).catch(() => ({ exists: false }));
	if (!info.exists) {
		status.className = "status error";
		status.textContent = "没有找到这个房间，可能已过期。请让对方重新发一次链接。";
		return;
	}
	location.href = `/games/${info.game}/?room=${code}`;
});

loadGames();
</script>
</body>
</html>
