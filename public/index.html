<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>两人游戏馆</title>
<meta name="theme-color" content="#fff8f0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="两人游戏馆">
<link rel="apple-touch-icon" href="/shared/app-icon-180.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;700&display=swap">
<style>
/* 布局：窄单列——两只小动物和馆名，加入房间码，下面是游戏卡片列表；每张卡片一键建房 */
:root {
	--cream: #fff8f0;
	--ink: #4a3a33;
	--muted: #8a7568;
	--card: #ffffff;
	--line: #f3e3d6;
	--pink: #ff9db7;
	--pink-deep: #d94875;
	--pink-soft: #ffe5ec;
	--mint-deep: #137a66;
	--mint-soft: #ddf5ee;
	--lav-deep: #6647b8;
	--lav-soft: #e8e1ff;
	--butter-deep: #9a641a;
	--butter-soft: #fff1c7;
	--font-display: "ZCOOL KuaiLe", "PingFang SC", "Microsoft YaHei", sans-serif;
	--font-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
	color-scheme: light;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

body {
	margin: 0;
	min-height: 100vh;
	background:
		radial-gradient(42vmax 42vmax at 0% 0%, rgba(255, 229, 236, 0.95), transparent 70%),
		radial-gradient(36vmax 36vmax at 100% 18%, rgba(221, 245, 238, 0.95), transparent 70%),
		radial-gradient(44vmax 40vmax at 40% 110%, rgba(232, 225, 255, 0.9), transparent 70%),
		var(--cream);
	background-attachment: fixed;
	color: var(--ink);
	font-family: var(--font-body);
	font-size: 15px;
	line-height: 1.6;
	padding-left: max(16px, env(safe-area-inset-left, 0px));
	padding-right: max(16px, env(safe-area-inset-right, 0px));
	padding-block: calc(36px + env(safe-area-inset-top, 0px)) calc(40px + env(safe-area-inset-bottom, 0px));
}

main {
	display: flex;
	flex-direction: column;
	gap: 28px;
	max-width: 560px;
	margin: 0 auto;
}

.ico { display: block; width: 100%; height: 100%; }

.hero { text-align: center; }

.pair {
	display: flex;
	align-items: flex-end;
	justify-content: center;
	gap: 6px;
	margin-bottom: 10px;
}

.pair .buddy {
	width: 64px;
	height: 64px;
	padding: 6px;
	border-radius: 50%;
	background: var(--card);
	box-shadow: 0 8px 20px rgba(170, 110, 90, 0.14);
}

.pair .buddy:first-child { background: var(--pink-soft); }
.pair .buddy:last-child { background: var(--butter-soft); }
.pair .love { width: 34px; height: 34px; margin-bottom: 14px; animation: beat 1.6s ease-in-out infinite; }

@keyframes beat {
	0%, 100% { transform: scale(1); }
	15% { transform: scale(1.18); }
	30% { transform: scale(0.96); }
	45% { transform: scale(1.1); }
}

h1 {
	margin: 0;
	font-family: var(--font-display);
	font-weight: 400;
	font-size: 2.4rem;
	line-height: 1.1;
	letter-spacing: 0.06em;
	text-wrap: balance;
}

.lead { margin: 8px auto 0; color: var(--muted); max-width: 26em; text-wrap: pretty; }

.box {
	padding: 18px;
	border-radius: 24px;
	background: rgba(255, 255, 255, 0.72);
	border: 1px solid var(--line);
	box-shadow: 0 10px 30px rgba(170, 110, 90, 0.1);
}

.join {
	display: flex;
	flex-wrap: wrap;
	gap: 10px;
	align-items: center;
}

.join input {
	flex: 1 1 180px;
	min-width: 0;
	padding: 10px 16px;
	border-radius: 999px;
	border: 2px solid var(--line);
	background: var(--card);
	color: var(--ink);
	font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
	font-size: 1.05rem;
	letter-spacing: 0.18em;
	text-transform: uppercase;
}

.join input::placeholder { color: #c4b1a5; letter-spacing: 0.06em; }
.join input:focus { border-color: var(--pink); outline: none; }

.btn {
	font-family: var(--font-display);
	font-size: 1.05rem;
	border: 0;
	border-radius: 999px;
	padding: 9px 20px;
	color: #fff;
	background: linear-gradient(180deg, #e8638d, var(--pink-deep));
	box-shadow: 0 4px 0 #b9375f, 0 10px 20px rgba(217, 72, 117, 0.2);
	cursor: pointer;
	white-space: nowrap;
}

.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 #b9375f; }
.btn:disabled { opacity: 0.6; cursor: progress; }
.btn:focus-visible, input:focus-visible { outline: 3px solid var(--pink); outline-offset: 2px; }

.section-title {
	display: flex;
	align-items: center;
	gap: 6px;
	margin: 0 0 12px;
	font-size: 0.8rem;
	font-weight: 400;
	letter-spacing: 0.12em;
	color: var(--muted);
}

.section-title .ico { width: 22px; height: 22px; }

.games { display: grid; gap: 14px; }

.game {
	display: grid;
	grid-template-columns: auto minmax(0, 1fr);
	gap: 16px;
	padding: 18px;
	border-radius: 24px;
	background: var(--card);
	border: 1px solid var(--line);
	box-shadow: 0 10px 30px rgba(170, 110, 90, 0.12);
}

.game .icon {
	width: 72px;
	height: 72px;
	padding: 8px;
	border-radius: 50%;
	background: var(--mint-soft);
}

.game h2 {
	margin: 0;
	font-family: var(--font-display);
	font-weight: 400;
	font-size: 1.45rem;
	line-height: 1.2;
}

.game p { margin: 4px 0 10px; color: var(--muted); font-size: 0.9rem; text-wrap: pretty; }

.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }

.tags span {
	padding: 1px 10px;
	border-radius: 999px;
	font-size: 0.75rem;
}

.tags span:nth-child(4n + 1) { background: var(--pink-soft); color: var(--pink-deep); }
.tags span:nth-child(4n + 2) { background: var(--mint-soft); color: var(--mint-deep); }
.tags span:nth-child(4n + 3) { background: var(--lav-soft); color: var(--lav-deep); }
.tags span:nth-child(4n + 4) { background: var(--butter-soft); color: var(--butter-deep); }

.status { min-height: 1.6em; color: var(--muted); font-size: 0.85rem; }
.status.error { color: var(--pink-deep); }

footer {
	display: flex;
	align-items: center;
	justify-content: center;
	gap: 6px;
	color: var(--muted);
	font-size: 0.8rem;
}

footer .ico { width: 20px; height: 20px; }

@media (prefers-reduced-motion: reduce) {
	.pair .love { animation: none; }
}
</style>
</head>
<body>
<main>
	<header class="hero">
		<div class="pair" aria-hidden="true">
			<div class="buddy"><svg class="ico"><use href="/shared/icons.svg#rabbit"/></svg></div>
			<svg class="ico love"><use href="/shared/icons.svg#heart"/></svg>
			<div class="buddy"><svg class="ico"><use href="/shared/icons.svg#cat"/></svg></div>
		</div>
		<h1>两人游戏馆</h1>
		<p class="lead">建一个房间，把链接发给想一起玩的人，两个人在各自的手机或电脑上慢慢玩。</p>
	</header>

	<section class="box">
		<h2 class="section-title"><svg class="ico" aria-hidden="true"><use href="/shared/icons.svg#invite"/></svg>收到房间码了？</h2>
		<form class="join" id="join-form">
			<input id="join-code" name="code" maxlength="6" autocomplete="off" placeholder="例如 K7QX2M" aria-label="房间码">
			<button class="btn" type="submit">加入</button>
		</form>
		<div class="status" id="join-status" role="status"></div>
	</section>

	<section>
		<h2 class="section-title"><svg class="ico" aria-hidden="true"><use href="/shared/icons.svg#flower"/></svg>选一个游戏</h2>
		<div class="games" id="games">
			<div class="status">正在加载游戏列表…</div>
		</div>
	</section>

	<footer><svg class="ico" aria-hidden="true"><use href="/shared/icons.svg#sprout"/></svg>房间闲置 7 天后自动清理</footer>
</main>

<script type="module">
import { createRoom, getRoomInfo, normalizeCode } from "/shared/room-client.js";
import { icon, isIconName } from "/shared/icons.js";

const gamesEl = document.querySelector("#games");

function gameCard(game) {
	const card = document.createElement("article");
	card.className = "game";
	card.innerHTML = `
		<div class="icon" aria-hidden="true"></div>
		<div>
			<h2></h2>
			<p></p>
			<div class="tags"></div>
			<button class="btn" type="button">创建房间</button>
			<div class="status" role="status"></div>
		</div>`;
	const iconEl = card.querySelector(".icon");
	if (isIconName(game.icon)) iconEl.append(icon(game.icon));
	else iconEl.textContent = game.icon || "🎲";
	card.querySelector("h2").textContent = game.name;
	card.querySelector("p").textContent = game.summary;
	card.querySelector(".tags").replaceChildren(...[`${game.maxPlayers} 人`, ...(game.tags || [])].map((tag) => {
		const span = document.createElement("span");
		span.textContent = tag;
		return span;
	}));
	const button = card.querySelector("button");
	const status = card.querySelector(".status");
	button.addEventListener("click", async () => {
		button.disabled = true;
		status.className = "status";
		status.textContent = "正在创建房间…";
		try {
			const code = await createRoom(game.id);
			location.href = `/games/${game.id}/?room=${code}`;
		} catch (error) {
			status.className = "status error";
			status.textContent = error.message;
			button.disabled = false;
		}
	});
	return card;
}

async function loadGames() {
	try {
		const response = await fetch("/api/games");
		const games = await response.json();
		gamesEl.replaceChildren(...games.map(gameCard));
	} catch {
		gamesEl.innerHTML = '<div class="status error">游戏列表加载失败，请刷新页面重试。</div>';
	}
}

document.querySelector("#join-form").addEventListener("submit", async (event) => {
	event.preventDefault();
	const status = document.querySelector("#join-status");
	const code = normalizeCode(document.querySelector("#join-code").value);
	if (code.length !== 6) {
		status.className = "status error";
		status.textContent = "房间码是 6 位字母或数字。";
		return;
	}
	status.className = "status";
	status.textContent = "正在查找房间…";
	const info = await getRoomInfo(code).catch(() => ({ exists: false }));
	if (!info.exists) {
		status.className = "status error";
		status.textContent = "没有找到这个房间，可能已过期。请让对方重新发一次链接。";
		return;
	}
	location.href = `/games/${info.game}/?room=${code}`;
});

loadGames();
</script>
</body>
</html>
